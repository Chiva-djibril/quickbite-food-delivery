<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M 50 10 L 18 22 L 18 50 Q 18 75 50 92 Q 82 75 82 50 L 82 22 Z' fill='%23dc2626' stroke='%231f2937' stroke-width='3'/%3E%3Ccircle cx='50' cy='48' r='20' fill='%23ffffff' stroke='%231f2937' stroke-width='2'/%3E%3Ccircle cx='50' cy='48' r='15' fill='none' stroke='%23f97316' stroke-width='2'/%3E%3Cpath d='M 42 75 L 47 80 L 58 70' fill='none' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
      .goog-te-banner-frame.skiptranslate,
      .goog-te-gadget-icon,
      .goog-te-gadget-simple,
      .goog-tooltip,
      .goog-tooltip:hover,
      .goog-text-highlight {
        display: none !important;
        visibility: hidden !important;
      }
      
      body {
        top: 0px !important;
        position: static !important;
      }
      
      .goog-te-gadget {
        height: 0;
        overflow: hidden;
        font-size: 0 !important;
      }
      
      .goog-te-gadget * {
        font-size: 0 !important;
      }
      
      #google_translate_element {
        display: none !important;
      }
    </style>
    
    <title>QuickBite - Food Delivery</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element"></div>
    
    <!-- 🔥 Google Translate Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,fr,es,rw,sw,zh,ja,ar,de,it,pt,ru,ko,hi',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
          },
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript" 
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
